<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PixelLamp · LED Landscape</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, "Inter", sans-serif;
        color: #eaeaea;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hint {
        position: fixed;
        left: 16px;
        bottom: 14px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.55;
        pointer-events: none;
        user-select: none;
        mix-blend-mode: difference;
      }
      .lil-gui {
        --background-color: rgba(10, 10, 12, 0.78);
        --widget-color: rgba(255, 255, 255, 0.08);
        --hover-color: rgba(255, 255, 255, 0.16);
        --focus-color: rgba(255, 255, 255, 0.22);
        --number-color: #ffd0a8;
        --string-color: #b9e4ff;
        --font-size: 11px;
        --input-font-size: 11px;
        --title-background-color: rgba(0, 0, 0, 0.55);
        --title-text-color: #ffe9d3;
        backdrop-filter: blur(14px) saturate(1.1);
        -webkit-backdrop-filter: blur(14px) saturate(1.1);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      }
      .lil-gui.root > .title {
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">pixellamp · LED art installation · prototype</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
